<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Fetcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #151518;
    --surface2: #1c1c21;
    --border: #2a2a30;
    --accent: #00e5a0;
    --accent-dim: #00e5a022;
    --text: #e8e8ec;
    --text-muted: #6e6e78;
    --danger: #ff4d6a;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }

  /* subtle noise */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  input, select {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }
  input::placeholder { color: var(--text-muted); }

  select {
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236e6e78' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 36px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  button {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent);
    color: #0c0c0e;
  }
  .btn-primary:hover { background: #00ffb3; }
  .btn-primary:disabled {
    background: var(--accent-dim);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* Status */
  .status {
    font-family: var(--mono);
    font-size: 0.8rem;
    min-height: 1.4em;
    transition: color 0.2s;
  }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--danger); }
  .status.loading { color: var(--text-muted); }

  /* Results */
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .results-header span {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .results-list {
    max-height: 380px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .results-list::-webkit-scrollbar { width: 5px; }
  .results-list::-webkit-scrollbar-track { background: transparent; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .model-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.82rem;
    opacity: 0;
    animation: slideIn 0.3s ease forwards;
  }
  .model-row .mid { color: var(--text); }
  .model-row .mown { color: var(--text-muted); font-size: 0.72rem; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 40px 0;
    font-family: var(--mono);
  }

  .csv-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
  }
  .csv-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="container">

  <h1>Model Fetcher</h1>

  <div class="card">
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="baseUrl" placeholder="https://api.openai.com">
    </div>

    <div class="field">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="row">
      <div class="field">
        <label>Query Mode</label>
        <select id="mode">
          <option value="list">List all models</option>
          <option value="single">Single model</option>
        </select>
      </div>
      <div class="field" id="modelField" style="display:none;">
        <label>Model ID</label>
        <input type="text" id="manualModel" placeholder="gpt-4o">
      </div>
    </div>

    <button class="btn-primary" id="fetchBtn" onclick="doFetch()">Fetch</button>
  </div>

  <div class="status" id="status"></div>

  <div class="card" id="resultsCard" style="display:none;">
    <div class="results-header">
      <span id="resultCount"></span>
      <span class="csv-badge" id="csvBadge" style="display:none;"></span>
    </div>
    <div class="results-list" id="resultsList"></div>
  </div>

</div>

<script>
  const modeSelect   = document.getElementById("mode");
  const modelField   = document.getElementById("modelField");
  const statusEl     = document.getElementById("status");
  const resultsCard  = document.getElementById("resultsCard");
  const resultsList  = document.getElementById("resultsList");
  const resultCount  = document.getElementById("resultCount");
  const csvBadge     = document.getElementById("csvBadge");
  const fetchBtn     = document.getElementById("fetchBtn");

  modeSelect.addEventListener("change", () => {
    modelField.style.display = modeSelect.value === "single" ? "" : "none";
  });

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = "status " + type;
  }

  async function doFetch() {
    const baseUrl   = document.getElementById("baseUrl").value.trim();
    const apiKey    = document.getElementById("apiKey").value.trim();
    const mode      = modeSelect.value;
    const manualId  = document.getElementById("manualModel").value.trim();

    if (!baseUrl || !apiKey) {
      setStatus("URL and API key are required.", "err");
      return;
    }

    fetchBtn.disabled = true;
    setStatus("Fetching...", "loading");
    resultsCard.style.display = "none";

    try {
      const resp = await fetch("/api/fetch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ baseUrl, apiKey, mode, manualModelId: manualId }),
      });

      const data = await resp.json();

      if (!resp.ok) {
        setStatus(data.error || "Request failed.", "err");
        return;
      }

      setStatus(`Fetched ${data.count} model(s) successfully.`, "ok");

      // Render
      resultsCard.style.display = "";
      resultCount.textContent = `${data.count} model(s)`;
      resultsList.innerHTML = "";

      if (data.csvFile) {
        csvBadge.style.display = "";
        csvBadge.textContent = `Saved → ${data.csvFile}`;
      } else {
        csvBadge.style.display = "none";
      }

      data.models.forEach((m, i) => {
        const row = document.createElement("div");
        row.className = "model-row";
        row.style.animationDelay = `${i * 0.03}s`;
        row.innerHTML = `
          <span class="mid">${esc(m.id)}</span>
          <span class="mown">${esc(m.owned_by || "")}</span>
        `;
        resultsList.appendChild(row);
      });

    } catch (err) {
      setStatus("Network error: " + err.message, "err");
    } finally {
      fetchBtn.disabled = false;
    }
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // Allow Enter to submit
  document.querySelectorAll("input").forEach(el => {
    el.addEventListener("keydown", e => { if (e.key === "Enter") doFetch(); });
  });
</script>
</body>
</html>
